  <rect x="775" y="600" width="35" height="40" fill="#eee7d6" stroke="#a99b74" stroke-width="1.5"/>
  <text x="792" y="650" font-size="7" fill="#6b5e3d" text-anchor="middle">Metro Archives</text>

  <!-- Undercroft (below grade) -->
  <rect x="825" y="640" width="35" height="25" fill="#2a2015" stroke="#5a4a30" stroke-width="1.5"/>
  <text x="842" y="675" font-size="7" fill="#5a4a30" text-anchor="middle">Undercroft</text>
  <text x="842" y="685" font-size="6" fill="#8a7245" text-anchor="middle">(foundation level)</text>

  <!-- Sector 0 (deep below grade) -->
  <rect x="625" y="640" width="20" height="15" fill="#12161d" stroke="#3d4a5a" stroke-width="1.5"/>
  <text x="635" y="665" font-size="7" fill="#3d4a5a" text-anchor="middle">Sector 0</text>
  <text x="635" y="675" font-size="6" fill="#8a7245" text-anchor="middle">(dead foundation)</text>

  <text x="615" y="500" font-size="8" fill="#7a6535">The Spire should be visible from every</text>
  <text x="615" y="512" font-size="8" fill="#7a6535">approved district's skyline — see</text>
  <text x="615" y="524" font-size="8" fill="#7a6535">Olympus_Spire.md Sec. 8 (optional,</text>
  <text x="615" y="536" font-size="8" fill="#7a6535">non-blocking polish suggestion).</text>

  <!-- ===================== LEGEND PANEL ===================== -->
  <rect x="940" y="84" width="230" height="700" fill="#fdfaf1" stroke="#c9ad72" stroke-width="2" rx="6"/>
  <text x="958" y="112" font-size="14" font-weight="bold" fill="#5a4620">LEGEND</text>

  <rect x="958" y="128" width="18" height="14" fill="#f3e6c4" stroke="#b89968" stroke-width="1.5"/>
  <text x="984" y="140" font-size="10" fill="#5a4620">Public / semi-restricted</text>

  <rect x="958" y="152" width="18" height="14" fill="#ecd8a4" stroke="#b89968" stroke-width="1.5"/>
