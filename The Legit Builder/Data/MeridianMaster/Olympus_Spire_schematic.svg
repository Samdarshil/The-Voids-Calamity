  <text x="958" y="270" font-size="11" font-weight="bold" fill="#5a4620">READING THIS DIAGRAM</text>
  <text x="958" y="290" font-size="9" fill="#7a6535">This is a cross-section, not a floor</text>
  <text x="958" y="304" font-size="9" fill="#7a6535">plan — levels stack vertically and</text>
  <text x="958" y="318" font-size="9" fill="#7a6535">reflect the Spire's own internal</text>
  <text x="958" y="332" font-size="9" fill="#7a6535">trust gradient (Sec. 10 of the</text>
  <text x="958" y="346" font-size="9" fill="#7a6535">design document).</text>

  <text x="958" y="380" font-size="11" font-weight="bold" fill="#5a4620">PRIORITY FLAG</text>
  <text x="958" y="400" font-size="9" fill="#8a5c14">The Server Hub's encounter</text>
  <text x="958" y="414" font-size="9" fill="#8a5c14">design is the single highest-</text>
  <text x="958" y="428" font-size="9" fill="#8a5c14">priority open item across all</text>
  <text x="958" y="442" font-size="9" fill="#8a5c14">five Phase 1 packages. See</text>
  <text x="958" y="456" font-size="9" fill="#8a5c14">Olympus_Spire.md Sec. 0.1.</text>

  <text x="958" y="492" font-size="11" font-weight="bold" fill="#5a4620">FIVE-DISTRICT LIGHT SPECTRUM</text>
  <text x="958" y="512" font-size="9" fill="#7a6535">Undercroft — honest imperfection</text>
  <text x="958" y="526" font-size="9" fill="#7a6535">Metro Archives — tired neglect</text>
  <text x="958" y="540" font-size="9" fill="#7a6535">White Zones — clean institutional</text>
  <text x="958" y="554" font-size="9" fill="#7a6535">Sector 0 — cold-to-warm arc</text>
  <text x="958" y="568" font-size="9" fill="#7a6535">Olympus Spire — filtered gold (this)</text>

  <text x="958" y="604" font-size="11" font-weight="bold" fill="#5a4620">NOTES</text>
  <text x="958" y="624" font-size="9" fill="#7a6535">Design schematic for greybox</text>
  <text x="958" y="638" font-size="9" fill="#7a6535">reference only. No literal height,</text>
  <text x="958" y="652" font-size="9" fill="#7a6535">footprint, or engineering geometry</text>
  <text x="958" y="666" font-size="9" fill="#7a6535">is implied anywhere in this file.</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="30" y="875" font-size="10" fill="#8a7245">VOID: The Unseen Hand — Design Studio — Olympus Spire Schematic — Companion to Olympus_Spire.md</text>
  <text x="900" y="875" font-size="10" fill="#8a7245" text-anchor="end">Rev 1.0 — Final Phase 1 Package</text>

</svg>
