  <text x="615" y="486" font-size="8" font-style="italic" fill="#8a7245">Relative height only — not to scale</text>

  <!-- ground line for inset -->
  <line x1="615" y1="640" x2="885" y2="640" stroke="#b89968" stroke-width="1.5"/>

