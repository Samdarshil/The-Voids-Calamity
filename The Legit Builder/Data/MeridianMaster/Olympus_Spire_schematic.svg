  <rect x="240" y="210" width="100" height="170" fill="#e9cf8f" stroke="#b89968" stroke-width="2" rx="3"/>
  <text x="250" y="235" font-size="11" font-weight="bold" fill="#5a4620">Atrium of</text>
  <text x="250" y="249" font-size="11" font-weight="bold" fill="#5a4620">Perfect Memory</text>
  <text x="250" y="267" font-size="8" fill="#7a6535">Boss encounter</text>
  <text x="250" y="279" font-size="8" fill="#7a6535">Gravity-altering,</text>
  <text x="250" y="291" font-size="8" fill="#7a6535">construct-based</text>
  <text x="250" y="303" font-size="8" fill="#7a6535">Engineered Gardens</text>
  <text x="250" y="315" font-size="8" fill="#7a6535">flagship instance</text>

  <rect x="350" y="210" width="100" height="170" fill="#e9cf8f" stroke="#c9963f" stroke-width="3" stroke-dasharray="6,4" rx="3"/>
  <text x="360" y="235" font-size="11" font-weight="bold" fill="#7a4e10">Olympus Spire</text>
  <text x="360" y="249" font-size="11" font-weight="bold" fill="#7a4e10">Server Hub</text>
  <text x="360" y="267" font-size="8" fill="#8a5c14">Reality/data-scape</text>
  <text x="360" y="279" font-size="8" fill="#8a5c14">blur — architecture</text>
  <text x="360" y="291" font-size="8" fill="#8a5c14">confirmed, encounter</text>
  <text x="360" y="303" font-size="8" fill="#8a5c14">FLAGGED (Sec. 0.1)</text>
  <circle cx="435" cy="222" r="9" fill="#c9963f"/>
  <text x="435" y="226" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>

  <text x="345" y="175" font-size="10" font-weight="bold" fill="#5a4620" text-anchor="middle">TECHNICAL / SYMBOLIC HEART</text>
  <text x="470" y="175" font-size="9" fill="#8a7245" text-anchor="end">highly restricted</text>

  <!-- ascension arrow -->
  <line x1="120" y1="690" x2="120" y2="220" stroke="#a97c2e" stroke-width="2" marker-end="url(#arrowGold)"/>
  <text x="105" y="460" font-size="10" font-weight="bold" fill="#a97c2e" text-anchor="middle" transform="rotate(-90 105 460)">ASCENSION = APPROACHING CENTER</text>

