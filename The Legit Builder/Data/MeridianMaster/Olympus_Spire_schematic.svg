<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <defs>
    <linearGradient id="towerGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff6df"/>
      <stop offset="55%" stop-color="#fbeccb"/>
      <stop offset="100%" stop-color="#f3ddb0"/>
    </linearGradient>
    <marker id="arrowGold" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#a97c2e"/>
    </marker>
  </defs>

  <!-- ===================== BACKGROUND ===================== -->
  <rect x="0" y="0" width="1200" height="900" fill="#f7f1e0"/>

  <!-- ===================== TITLE BLOCK ===================== -->
  <rect x="0" y="0" width="1200" height="64" fill="#eaddb8"/>
  <text x="30" y="28" font-size="20" font-weight="bold" fill="#5a4620">VOID: THE UNSEEN HAND — OLYMPUS SPIRE</text>
  <text x="30" y="50" font-size="13" fill="#7a6535">Vertical Cross-Section + Skyline Dominance — NOT surveyed engineering geometry</text>
  <text x="1000" y="28" font-size="12" fill="#7a6535">Location 05 of 5 — FINAL</text>
  <text x="1000" y="46" font-size="12" fill="#7a6535">Phase 1 — Rev. 1.0</text>

  <!-- ===================== MAIN FRAME ===================== -->
  <rect x="30" y="84" width="890" height="770" fill="#fdfaf1" stroke="#c9ad72" stroke-width="2" rx="6"/>
  <text x="55" y="112" font-size="13" font-weight="bold" fill="#5a4620">INTERNAL TRUST GRADIENT — VERTICAL CROSS-SECTION</text>

  <!-- ground line -->
  <line x1="55" y1="700" x2="900" y2="700" stroke="#b89968" stroke-width="2"/>
  <text x="860" y="716" font-size="9" fill="#8a7245" text-anchor="end">street grade</text>

  <!-- ===================== TOWER SILHOUETTE (background shape) ===================== -->
  <path d="M 130 700 L 180 545 L 205 390 L 205 200 L 475 200 L 475 390 L 500 545 L 550 700 Z"
        fill="url(#towerGlow)" stroke="#c9ad72" stroke-width="2"/>

  <!-- ===================== LEVEL 1: BASE PLAZA ===================== -->
  <rect x="150" y="655" width="360" height="45" fill="#f3e6c4" stroke="#b89968" stroke-width="2" rx="3"/>
  <text x="165" y="675" font-size="11" font-weight="bold" fill="#5a4620">Base Plaza + The Continuity Monument</text>
  <text x="165" y="691" font-size="8" fill="#7a6535">Fully public — only public interior in the district</text>

  <!-- ===================== LEVEL 2: PARTY LEVEL ===================== -->
  <rect x="195" y="560" width="270" height="90" fill="#f0dfb4" stroke="#b89968" stroke-width="2" rx="3"/>
  <text x="210" y="588" font-size="12" font-weight="bold" fill="#5a4620">Party Level</text>
  <text x="210" y="604" font-size="9" fill="#7a6535">Mission 7 — social stealth, disguises</text>
  <text x="210" y="618" font-size="9" fill="#7a6535">Semi-restricted — invitation/disguise gated</text>
  <text x="210" y="632" font-size="9" fill="#7a6535">Guest ledger lists titles, not names</text>

  <!-- ===================== LEVEL 3: COUNCIL / DIRECTOR / GALLERY ===================== -->
  <rect x="225" y="390" width="210" height="160" fill="#ecd8a4" stroke="#b89968" stroke-width="2" rx="3"/>
  <text x="238" y="415" font-size="12" font-weight="bold" fill="#5a4620">Council Chambers</text>
  <text x="238" y="431" font-size="9" fill="#7a6535">Ceremonial votes — nine Councilors + Director</text>
  <text x="238" y="453" font-size="12" font-weight="bold" fill="#5a4620">Director's Office</text>
  <text x="238" y="469" font-size="9" fill="#7a6535">Voss — Mission 7 private dialogue</text>
  <text x="238" y="491" font-size="12" font-weight="bold" fill="#5a4620">Portrait Gallery</text>
  <text x="238" y="507" font-size="9" fill="#7a6535">Optional — Voss the only unsmiling portrait</text>
  <text x="238" y="529" font-size="9" fill="#8a5c14" font-weight="bold">Restricted — behavior-screened access</text>

