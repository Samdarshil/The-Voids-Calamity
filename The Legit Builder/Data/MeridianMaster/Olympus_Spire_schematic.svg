  <circle cx="967" cy="210" r="7" fill="#c9963f"/>
  <text x="967" y="215" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text x="984" y="214" font-size="10" fill="#5a4620">Canon discrepancy (Sec. 0.1)</text>

  <line x1="958" y1="236" x2="976" y2="236" stroke="#a97c2e" stroke-width="2"/>
