<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">

  <!-- ===================== BACKGROUND ===================== -->
  <rect x="0" y="0" width="1200" height="900" fill="#eef3f6"/>

  <!-- ===================== TITLE BLOCK ===================== -->
  <rect x="0" y="0" width="1200" height="64" fill="#dce7ee"/>
  <text x="30" y="28" font-size="20" font-weight="bold" fill="#20303d">VOID: THE UNSEEN HAND — WHITE ZONES</text>
  <text x="30" y="50" font-size="13" fill="#4a5b68">Flagship Instance Schematic (Mission 5 / SQ4) — Top-Down Design Blueprint — NOT surveyed engineering geometry</text>
  <text x="1000" y="28" font-size="12" fill="#4a5b68">Location 02 of 5</text>
  <text x="1000" y="46" font-size="12" fill="#4a5b68">Phase 1 — Rev. 1.0</text>

  <!-- ===================== MAIN SCHEMATIC FRAME ===================== -->
  <rect x="30" y="84" width="890" height="770" fill="#ffffff" stroke="#b9c9d3" stroke-width="2" rx="6"/>

  <!-- District catchment boundary -->
  <rect x="55" y="110" width="840" height="700" fill="none" stroke="#9fb4c1" stroke-width="1.5" stroke-dasharray="10,6" rx="4"/>
  <text x="65" y="128" font-size="12" fill="#6b7d89" font-style="italic">Flagship catchment boundary (walkable-access radius, not to scale)</text>

  <!-- ===================== RESIDENTIAL BLOCK (Mira's Apartment) ===================== -->
  <rect x="90" y="470" width="170" height="150" fill="#f2ece1" stroke="#c9b89a" stroke-width="2" rx="4"/>
  <text x="105" y="495" font-size="13" font-weight="bold" fill="#5c4a2e">Residential Block</text>
  <text x="105" y="513" font-size="11" fill="#5c4a2e">Mira's Apartment</text>
  <text x="105" y="529" font-size="10" fill="#7a6a4d">(approx. location —</text>
  <text x="105" y="543" font-size="10" fill="#7a6a4d">Phase 2 full detail)</text>
  <text x="105" y="600" font-size="10" fill="#9c8c6d">Mission 5</text>
  <text x="105" y="614" font-size="10" fill="#9c8c6d">extraction origin</text>

  <!-- ===================== ENFORCER STAGING ALCOVE ===================== -->
  <rect x="300" y="170" width="110" height="90" fill="#e4e0e6" stroke="#8b7f96" stroke-width="2" rx="4"/>
  <text x="313" y="200" font-size="12" font-weight="bold" fill="#3d3448">Enforcer</text>
  <text x="313" y="216" font-size="12" font-weight="bold" fill="#3d3448">Staging</text>
  <text x="313" y="232" font-size="12" font-weight="bold" fill="#3d3448">Alcove</text>
  <text x="313" y="250" font-size="9" fill="#6b6178">Enforcement-only</text>

  <!-- ===================== ADMINISTRATIVE BACK OFFICES ===================== -->
  <rect x="420" y="170" width="220" height="90" fill="#dfe6ec" stroke="#7d97a8" stroke-width="2" rx="4"/>
  <text x="435" y="200" font-size="13" font-weight="bold" fill="#233846">Administrative Back Offices</text>
  <text x="435" y="218" font-size="11" fill="#3f5866">Talis Bren — SQ4</text>
  <text x="435" y="236" font-size="9" fill="#5c7180">Restricted — badge / cover-story gated</text>

  <!-- ===================== RECORDS / AUDIT CLOSET (VESSEL-9) ===================== -->
  <rect x="650" y="170" width="140" height="90" fill="#f5e9d6" stroke="#c9963f" stroke-width="3" stroke-dasharray="6,4" rx="4"/>
  <text x="662" y="196" font-size="12" font-weight="bold" fill="#7a4e10">Records /</text>
  <text x="662" y="212" font-size="12" font-weight="bold" fill="#7a4e10">Audit Closet</text>
  <text x="662" y="230" font-size="10" fill="#8a5c14">VESSEL-9 (hidden boss)</text>
  <text x="662" y="245" font-size="9" fill="#8a5c14">Highly restricted</text>
  <!-- warning icon -->
  <circle cx="775" cy="185" r="10" fill="#c9963f"/>
  <text x="775" y="190" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>

  <!-- ===================== CLINIC WING ===================== -->
  <rect x="300" y="280" width="150" height="180" fill="#dfeaf0" stroke="#6f95a8" stroke-width="2" rx="4"/>
  <text x="315" y="310" font-size="13" font-weight="bold" fill="#1f3d4a">Clinic Wing</text>
  <text x="315" y="328" font-size="10" fill="#3f6270">Public — logged</text>

  <!-- ===================== RECEPTION ATRIUM ===================== -->
  <rect x="460" y="280" width="180" height="180" fill="#e6f1f5" stroke="#5c8ba0" stroke-width="2.5" rx="4"/>
