  <text x="480" y="348" font-size="14" font-weight="bold" fill="#1c4152">Atrium</text>
  <text x="480" y="368" font-size="10" fill="#3f6270">Fully public — social stealth</text>
  <text x="480" y="382" font-size="10" fill="#3f6270">SQ4 cover-story entry point</text>

  <!-- ===================== RATION DISTRIBUTION HALL ===================== -->
  <rect x="660" y="280" width="150" height="180" fill="#dfeaf0" stroke="#6f95a8" stroke-width="2" rx="4"/>
  <text x="672" y="310" font-size="13" font-weight="bold" fill="#1f3d4a">Ration Distribution</text>
  <text x="672" y="326" font-size="13" font-weight="bold" fill="#1f3d4a">Hall</text>
  <text x="672" y="346" font-size="10" fill="#3f6270">Public — logged</text>
  <!-- roof access marker -->
  <circle cx="790" cy="290" r="7" fill="#7ab0c7"/>
  <text x="800" y="294" font-size="9" fill="#3f6270">Roof hatch ↑</text>

  <!-- ===================== REGISTRATION OFFICE ===================== -->
  <rect x="500" y="470" width="100" height="60" fill="#dfeaf0" stroke="#6f95a8" stroke-width="2" rx="4"/>
  <text x="512" y="495" font-size="11" font-weight="bold" fill="#1f3d4a">Registration</text>
  <text x="512" y="510" font-size="11" font-weight="bold" fill="#1f3d4a">Office</text>

  <!-- ===================== ENTRY PLAZA ===================== -->
  <rect x="300" y="550" width="440" height="150" fill="#f4f8fa" stroke="#a9c2cf" stroke-width="2" rx="4"/>
  <text x="315" y="580" font-size="14" font-weight="bold" fill="#2c4756">Entry Plaza</text>
  <text x="315" y="598" font-size="10" fill="#527180">Open civic approach — Mission 5 escalation zone</text>
  <text x="315" y="614" font-size="10" fill="#527180">Heavy standing Enforcer patrol baseline</text>

  <!-- civilian queue dots -->
  <circle cx="380" cy="650" r="5" fill="#8fa8b5"/>
  <circle cx="410" cy="655" r="5" fill="#8fa8b5"/>
  <circle cx="440" cy="648" r="5" fill="#8fa8b5"/>
  <circle cx="470" cy="653" r="5" fill="#8fa8b5"/>
  <text x="380" y="675" font-size="9" fill="#7a8f9c">civilian queue (typ.)</text>

  <!-- ===================== PRIMARY APPROACH ROAD ===================== -->
  <rect x="55" y="720" width="840" height="60" fill="#c9d2d8"/>
  <text x="70" y="745" font-size="12" font-weight="bold" fill="#3a4750">Primary Approach Road</text>
  <text x="70" y="762" font-size="9" fill="#5a6870">Pedestrian flow + Enforcer rapid-deployment lane</text>

  <!-- Metro / grav-rail stop -->
  <rect x="760" y="725" width="90" height="50" fill="#b8cdd9" stroke="#5c8ba0" stroke-width="2" rx="3"/>
  <text x="770" y="745" font-size="10" font-weight="bold" fill="#1c4152">Grav-Rail</text>
  <text x="770" y="760" font-size="10" font-weight="bold" fill="#1c4152">Stop</text>

  <!-- ===================== EXTRACTION / ESCORT ROUTE ===================== -->
  <path d="M 260 555 C 340 620, 380 640, 460 610 C 500 590, 480 500, 500 470"
        fill="none" stroke="#c0473f" stroke-width="3" stroke-dasharray="9,6" marker-end="url(#arrowRed)"/>
  <text x="555" y="685" font-size="11" font-weight="bold" fill="#a8382f">Mission 5 Extraction Route</text>
  <text x="555" y="699" font-size="9" fill="#a8382f">(residential → plaza → atrium)</text>

  <!-- ===================== ECHO SHIFT SECONDARY ROUTE ===================== -->
  <path d="M 790 290 C 850 340, 850 430, 790 470 C 760 500, 700 500, 660 490"
        fill="none" stroke="#4e8f5c" stroke-width="3" stroke-dasharray="4,5" marker-end="url(#arrowGreen)"/>
  <text x="820" y="360" font-size="10" font-weight="bold" fill="#356b40" transform="rotate(90 820 360)">Echo Shift route (optional)</text>

  <!-- ===================== ARROW MARKERS ===================== -->
  <defs>
    <marker id="arrowRed" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0473f"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#4e8f5c"/>
    </marker>
  </defs>

  <!-- ===================== COMPASS / RADIAL ORIENTATION ===================== -->
  <g transform="translate(175,675)">
    <circle cx="0" cy="0" r="38" fill="#ffffff" stroke="#9fb4c1" stroke-width="1.5"/>
    <line x1="0" y1="-30" x2="0" y2="30" stroke="#9fb4c1" stroke-width="1"/>
    <path d="M0,-30 L-6,-18 L6,-18 Z" fill="#2c4756"/>
    <text x="0" y="-42" font-size="8" font-weight="bold" fill="#2c4756" text-anchor="middle">TOWARD SPIRE</text>
    <text x="0" y="48" font-size="8" font-weight="bold" fill="#6b5230" text-anchor="middle">TOWARD UNDERCROFT</text>
    <text x="0" y="58" font-size="8" font-weight="bold" fill="#6b5230" text-anchor="middle">/ OUTER RINGS</text>
  </g>

  <!-- ===================== LEGEND PANEL ===================== -->
  <rect x="940" y="84" width="230" height="700" fill="#ffffff" stroke="#b9c9d3" stroke-width="2" rx="6"/>
  <text x="958" y="112" font-size="14" font-weight="bold" fill="#20303d">LEGEND</text>

  <rect x="958" y="128" width="18" height="14" fill="#dfeaf0" stroke="#6f95a8" stroke-width="1.5"/>
  <text x="984" y="140" font-size="10" fill="#2c3e50">Public / logged wing</text>

  <rect x="958" y="152" width="18" height="14" fill="#dfe6ec" stroke="#7d97a8" stroke-width="1.5"/>
