  <rect x="958" y="176" width="18" height="14" fill="#f5e9d6" stroke="#c9963f" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="984" y="188" font-size="10" fill="#2c3e50">Highly restricted / boss</text>

  <rect x="958" y="200" width="18" height="14" fill="#e4e0e6" stroke="#8b7f96" stroke-width="1.5"/>
  <text x="984" y="212" font-size="10" fill="#2c3e50">Enforcement-only</text>

  <line x1="958" y1="232" x2="976" y2="232" stroke="#c0473f" stroke-width="3" stroke-dasharray="6,4"/>
  <text x="984" y="236" font-size="10" fill="#2c3e50">Extraction / escort route</text>

  <line x1="958" y1="252" x2="976" y2="252" stroke="#4e8f5c" stroke-width="3" stroke-dasharray="4,4"/>
  <text x="984" y="256" font-size="10" fill="#2c3e50">Echo Shift secondary route</text>

  <circle cx="967" cy="274" r="7" fill="#c9963f"/>
  <text x="967" y="279" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">!</text>
  <text x="984" y="278" font-size="10" fill="#2c3e50">Hidden boss (VESSEL-9)</text>

  <circle cx="967" cy="298" r="6" fill="#7ab0c7"/>
  <text x="984" y="302" font-size="10" fill="#2c3e50">Roof / Echo Shift access</text>

  <rect x="958" y="316" width="18" height="14" fill="#b8cdd9" stroke="#5c8ba0" stroke-width="1.5"/>
  <text x="984" y="328" font-size="10" fill="#2c3e50">Grav-rail stop</text>

  <rect x="958" y="340" width="18" height="14" fill="#f2ece1" stroke="#c9b89a" stroke-width="1.5"/>
  <text x="984" y="352" font-size="10" fill="#2c3e50">Adjacent residential block</text>

  <line x1="958" y1="370" x2="976" y2="370" stroke="#9fb4c1" stroke-width="1" stroke-dasharray="10,6"/>
  <text x="984" y="374" font-size="10" fill="#2c3e50">Catchment boundary</text>

  <text x="958" y="410" font-size="11" font-weight="bold" fill="#20303d">NOTES</text>
  <text x="958" y="430" font-size="9" fill="#4a5b68">This is a design schematic for</text>
  <text x="958" y="444" font-size="9" fill="#4a5b68">greybox reference. No literal</text>
  <text x="958" y="458" font-size="9" fill="#4a5b68">coordinates, footprint dimensions,</text>
  <text x="958" y="472" font-size="9" fill="#4a5b68">or engineering geometry are implied.</text>
  <text x="958" y="486" font-size="9" fill="#4a5b68">Rooftop Mechanical Level is a</text>
  <text x="958" y="500" font-size="9" fill="#4a5b68">separate upper story, accessed via</text>
  <text x="958" y="514" font-size="9" fill="#4a5b68">the marked roof hatch (Ration Hall).</text>

  <text x="958" y="546" font-size="11" font-weight="bold" fill="#20303d">TYPOLOGY STATUS</text>
  <text x="958" y="566" font-size="9" fill="#4a5b68">This diagram is the FLAGSHIP</text>
  <text x="958" y="580" font-size="9" fill="#4a5b68">instance (Mission 5 / SQ4).</text>
  <text x="958" y="594" font-size="9" fill="#4a5b68">Non-flagship network nodes reuse</text>
  <text x="958" y="608" font-size="9" fill="#4a5b68">the same kit-of-parts at reduced</text>
  <text x="958" y="622" font-size="9" fill="#4a5b68">scale — see White_Zones.md Sec. 8.</text>

  <!-- ===================== FOOTER ===================== -->
  <text x="30" y="875" font-size="10" fill="#6b7d89">VOID: The Unseen Hand — Design Studio — White Zones Schematic — Companion to White_Zones.md</text>
  <text x="900" y="875" font-size="10" fill="#6b7d89" text-anchor="end">Rev 1.0</text>

</svg>
